name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to package and upload, for example v2.1.0-beta.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 release asset
            os: ubuntu-24.04
            platform: linux
            target: linux
            format: tar.gz
            arch: x64
            asset: linux-x64-electron.tar.gz
          - name: macOS x64 release asset
            os: macos-13
            platform: macos
            target: mac
            format: zip
            arch: x64
            asset: macos-x64-electron.zip
          - name: macOS arm64 release asset
            os: macos-14
            platform: macos
            target: mac
            format: zip
            arch: arm64
            asset: macos-arm64-electron.zip

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run native:build

          node ./node_modules/electron-builder/cli.js \
            --${{ matrix.target }} ${{ matrix.format }} \
            --${{ matrix.arch }} \
            --publish never

      - name: Run native smoke
        run: npm run smoke:native

      - name: Resolve packaged output
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          asset_path="dist/Translate-Ter-v${version}-${{ matrix.asset }}"

          if [[ ! -f "$asset_path" ]]; then
            echo "Packaged output file was not found: $asset_path" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ steps.release.outputs.tag }} "${{ steps.package.outputs.asset_path }}" --clobber
