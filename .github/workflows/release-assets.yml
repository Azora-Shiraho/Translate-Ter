name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to package and upload, for example v2.1.0-beta.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 release asset
            os: macos-14
            platform: macos
          - name: Linux x64 release asset
            os: ubuntu-24.04
            platform: linux

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate macOS signing setup
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for key in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required macOS signing/notarization secrets: ${missing[*]}" >&2
            echo "Refusing to upload an unsigned macOS release asset because Gatekeeper will flag it as damaged or untrusted." >&2
            exit 1
          fi

      - name: Build release assets
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          npm run build
          npm run native:build

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            node ./node_modules/electron-builder/cli.js \
              --mac zip \
              --arm64 \
              --publish never \
              -c.mac.hardenedRuntime=true \
              -c.mac.notarize=true \
              -c.mac.entitlements=build/entitlements.mac.plist \
              -c.mac.entitlementsInherit=build/entitlements.mac.inherit.plist
          else
            node ./node_modules/electron-builder/cli.js \
              --linux tar.gz \
              --x64 \
              --publish never
          fi

      - name: Run native smoke
        run: npm run smoke:native

      - name: Verify notarized macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="dist/mac-arm64/Translate-Ter.app"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Resolve packaged output
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            asset_path="dist/Translate-Ter-v${version}-macos-arm64-electron.zip"
          else
            asset_path="dist/Translate-Ter-v${version}-linux-x64-electron.tar.gz"
          fi

          if [[ ! -f "$asset_path" ]]; then
            echo "Packaged output file was not found: $asset_path" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ steps.release.outputs.tag }} "${{ steps.package.outputs.asset_path }}" --clobber
